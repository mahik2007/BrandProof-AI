<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FF78" />
      <stop offset="100%" stop-color="#B2EB46" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#C7F36B" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="12" y="12" width="136" height="136" rx="36" fill="url(#limeGrad)" filter="url(#glow)"/>
  
  <!-- Shield/Monogram Container -->
  <g transform="translate(80, 80)">
    <!-- BP Monogram -->
    <text x="0" y="16" 
          font-family="'Space Grotesk', -apple-system, system-ui, sans-serif" 
          font-size="64" 
          font-weight="800" 
          fill="#10192C" 
          text-anchor="middle" 
          letter-spacing="-3">BP</text>
  </g>
</svg>
