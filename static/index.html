  <!-- Container for Authenticated Application Workspace -->

    <!-- Sidebar Navigation -->

      <nav class="sb-nav" id="sidebar-nav">

        <a href="#/overview" class="sb-nav-item active" data-nav="overview">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          <span>Overview</span>
        </a>
        <a href="#/audit" class="sb-nav-item" data-nav="audit">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          <span>Smart Audit</span>
        </a>
        <a href="#/fixlab" class="sb-nav-item" data-nav="fixlab">

          <span>Fix Lab</span>
        </a>

        <span class="sb-section-label" style="margin-top:10px;">Governance</span>
        <a href="#/desk" class="sb-nav-item" data-nav="desk">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <span>Review Desk</span>
        </a>
        <a href="#/policies" class="sb-nav-item" data-nav="policies">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>Brand Policies</span>
        </a>
        <a href="#/scan" class="sb-nav-item" data-nav="scan">

        <span class="sb-section-label" style="margin-top:10px;">Verification & Proof</span>

          <span>Activity Log</span>
        </a>
        <a href="#/about" class="sb-nav-item" data-nav="about">

      </nav>

      <div class="sb-footer">
        <div class="sb-role-switcher">
          <label class="sb-role-label">Acting Persona</label>
          <select id="role-selector" class="sb-role-select">
            <option value="creator">Creator (Riya Sharma)</option>
            <option value="compliance">Compliance (Neha Verma)</option>
            <option value="reviewer">Reviewer (Kabir Singh)</option>
            <option value="admin">Brand Admin (Ayush Kumar)</option>
          </select>
        </div>
        <div class="sb-team-tag">
          <span>Team BugHunters</span>
          <span style="color:var(--lime);">IIT Patna</span>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Container -->
    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <div class="workspace-badge">
            <span class="dot"></span>
            <span id="topbar-org-name">ABC Electronics</span>
            <span class="tag-sandbox">Demo Sandbox</span>
          </div>
        </div>
        <div class="topbar-right">
          <a href="#/landing" class="btn btn-sm">← Back to Landing Page</a>
          <button class="btn btn-sm btn-primary" id="btn-restart-demo">↻ Reset Sandbox</button>
        </div>
      </header>

      <main class="content-area" id="main-content">
        <!-- Rendered view goes here -->
      </main>
    </div>
  </div>

  <script src="/js/api.js?v=4"></script>
  <script src="/js/findings.js?v=4"></script>
  <script src="/js/landing.js?v=4"></script>
  <script src="/js/workflow.js?v=4"></script>
  <script>
    (async function init() {
      // Initialize demo session
      try {
        if (window.API && typeof API.startDemo === "function") {
          const demo = await API.startDemo();
          if (demo && demo.org_name) {
            AppState.user = demo;
            const orgEl = document.getElementById("topbar-org-name");
            if (orgEl) orgEl.textContent = demo.org_name;
          }
        }
      } catch (e) {
        console.warn("API/Demo session check:", e);
      }

      // Persona role switch
      const roleSel = document.getElementById("role-selector");
      if (roleSel) {
        roleSel.onchange = (e) => {
          AppState.currentRole = e.target.value;
          route();
        };
      }

      const restartBtn = document.getElementById("btn-restart-demo");
      if (restartBtn) {
        restartBtn.onclick = async () => {
          try {
            await API.startDemo();
          } catch (e) {
            console.warn("Reset demo:", e);
          }
          location.reload();
        };
      }

      // Robust Router
      async function route() {
        try {
          const path = window.location.pathname;
          const hash = (location.hash || "").replace(/^#\/?/, "");

          const landingContainer = document.getElementById("landing-view");
          const layoutContainer = document.getElementById("layout");

          // Determine whether to display Landing Page or Workspace
          const isLanding = (!hash && (path === "/" || path.endsWith("index.html"))) || hash === "landing" || hash === "home";

          if (isLanding) {
            if (layoutContainer) layoutContainer.style.display = "none";
            if (landingContainer) {
              landingContainer.style.display = "block";
              if (window.LandingPage && typeof LandingPage.render === "function") {
                landingContainer.innerHTML = LandingPage.render();
              } else {
                landingContainer.innerHTML = `<div style="padding:40px;text-align:center;"><h2>BrandProof AI</h2><p>Loading landing interface...</p><a href="#/overview" class="btn btn-primary">Launch Workspace</a></div>`;
              }
            }
            
            // Hide walkthrough on landing
            const wt = document.getElementById("walkthrough-container");
            if (wt) wt.style.display = "none";
            window.scrollTo(0, 0);
            return;
          }

          // Otherwise display Workspace
          if (landingContainer) landingContainer.style.display = "none";
          if (layoutContainer) layoutContainer.style.display = "flex";
          
          const wt = document.getElementById("walkthrough-container");
          if (wt) wt.style.display = "block";

          const targetView = (hash === "workspace" || !hash) ? "overview" : hash;
          const content = document.getElementById("main-content");
          
          // Update active navigation item
          document.querySelectorAll(".sb-nav-item").forEach(a => {
            a.classList.toggle("active", a.dataset.nav === targetView);
          });

          if (window.Views && Views[targetView]) {
            await Views[targetView](content);
          } else if (window.Views && Views.overview) {
            await Views.overview(content);
          }
          if (window.Views && typeof Views.renderWalkthrough === "function") {
            Views.renderWalkthrough();
          }
        } catch (routerErr) {
          console.error("Router navigation error:", routerErr);
          // Failsafe: Ensure landing or workspace is visible
          const landingContainer = document.getElementById("landing-view");
          if (landingContainer) {
            landingContainer.style.display = "block";
            landingContainer.innerHTML = LandingPage.render();
          }
        }
      }

      window.addEventListener("hashchange", route);
      try {
        await route();
      } catch (initErr) {
        console.error("Initialization error:", initErr);
        const landingContainer = document.getElementById("landing-view");
        if (landingContainer && window.LandingPage) {
          landingContainer.style.display = "block";
          landingContainer.innerHTML = LandingPage.render();
        }
      }
    })();
  </script>
</body>
</html>
